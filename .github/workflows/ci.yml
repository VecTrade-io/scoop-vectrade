name: CI

on:
  push:
    branches: [main, fix/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate JSON syntax
        run: |
          for f in bucket/*.json; do
            echo "Validating $f..."
            python3 -m json.tool "$f" > /dev/null
          done
          echo "All manifests are valid JSON."

      - name: Check required fields
        run: |
          for f in bucket/*.json; do
            echo "Checking $f..."
            for field in version description homepage license architecture bin; do
              if ! python3 -c "import json,sys; d=json.load(open('$f')); assert '$field' in d" 2>/dev/null; then
                echo "ERROR: Missing required field '$field' in $f"
                exit 1
              fi
            done
          done
          echo "All required fields present."

      - name: Validate URL structure
        run: |
          python3 -c "
          import json, sys
          from pathlib import Path
          errors = []
          for f in Path('bucket').glob('*.json'):
              d = json.loads(f.read_text())
              for arch in d.get('architecture', {}).values():
                  url = arch.get('url', '')
                  if 'github.com/VecTrade-io/vectrade-cli/releases' not in url:
                      errors.append(f'{f}: URL does not point to VecTrade releases: {url}')
                  if not url.endswith('.zip'):
                      errors.append(f'{f}: URL must end with .zip: {url}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All URLs valid.')
          "

  test:
    name: Test Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest

      - name: Run validation tests
        run: pytest tests/ -v --tb=short

  scoop-check:
    name: Scoop Checkver
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Scoop
        shell: pwsh
        run: |
          # Hosted runners are elevated; the installer refuses admin unless told otherwise.
          Invoke-Expression "& {$(Invoke-RestMethod https://get.scoop.sh)} -RunAsAdmin"
          Join-Path $env:USERPROFILE 'scoop\shims' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate manifest with Scoop
        shell: pwsh
        run: |
          scoop bucket add vectrade "$PWD"
          scoop cat vectrade/vectrade
          scoop info vectrade/vectrade
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check for hardcoded secrets
        run: |
          if grep -rn 'vq_live_[a-zA-Z0-9]\{10,\}' --include="*.json" .; then
            echo "ERROR: Found hardcoded live API keys!"
            exit 1
          fi
          echo "No hardcoded secrets found"

      - name: Verify download URLs point to official releases
        run: |
          python3 -c "
          import json
          from pathlib import Path
          for f in Path('bucket').glob('*.json'):
              d = json.loads(f.read_text())
              for arch in d.get('architecture', {}).values():
                  url = arch.get('url', '')
                  assert 'github.com/VecTrade-io' in url, f'Untrusted URL in {f}: {url}'
          print('All URLs point to official VecTrade releases.')
          "
